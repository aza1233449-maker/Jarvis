              private fun restartSoon() {
                  if (!Prefs.continuous || !resumed) return
                  main.postDelayed({
                      if (Prefs.continuous && resumed && !listening) listen(false)
                  }, 500)
              }

              private fun listen(manualFlag: Boolean) {
                  if (listening) return
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 7)
                      return
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      addLog("Jarvis", "Este teléfono no tiene reconocimiento de voz. Active o instale la app Google.")
                      return
                  }
                  Speaker.stop()
                  manual = manualFlag
                  val r: SpeechRecognizer = recognizer ?: SpeechRecognizer.createSpeechRecognizer(this).also {
                      it.setRecognitionListener(listener)
                      recognizer = it
                  }
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "es-419")
                  i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                  i.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1)
                  listening = true
                  r.startListening(i)
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      listen(true)
                  } else {
                      addLog("Jarvis", "Sin permiso de micrófono no puedo escucharle. Puede escribir sus órdenes.")
                  }
              }

              private val listener = object : RecognitionListener {
                  override fun onReadyForSpeech(params: Bundle?) {
                      setState(1)
                  }

                  override fun onBeginningOfSpeech() {}
                  override fun onRmsChanged(rmsdB: Float) {}
                  override fun onBufferReceived(buffer: ByteArray?) {}
                  override fun onEndOfSpeech() {}
                  override fun onEvent(eventType: Int, params: Bundle?) {}

                  override fun onPartialResults(partialResults: Bundle?) {
                      val t = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull().orEmpty()
                      if (t.isNotEmpty()) statusTv.text = "…$t"
                  }

                  override fun onResults(results: Bundle?) {
                      listening = false
                      val t = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull().orEmpty()
                      process(t)
                  }

                  override fun onError(error: Int) {
                      listening = false
                      setState(0)
                      if (error == SpeechRecognizer.ERROR_RECOGNIZER_BUSY) {
                          try {
                              recognizer?.destroy()
                          } catch (e: Exception) {
                          }
                          recognizer = null
                      }
                      val quiet = error == SpeechRecognizer.ERROR_NO_MATCH || error == SpeechRecognizer.ERROR_SPEECH_TIMEOUT
                      if (error == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) {
                          requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 7)
                          return
                      }
                      if (Prefs.continuous && resumed) {
                          if (quiet) {
                              restartSoon()
                          } else {
                              errors++
                              if (errors <= 4) {
                                  main.postDelayed({
                                      if (Prefs.continuous && resumed && !listening) listen(false)
                                  }, 1500)
                              } else {
                                  Prefs.continuous = false
                                  contSwitch.isChecked = false
                                  addLog("Jarvis", "Desactivé la escucha continua porque el reconocimiento de voz falla. Revise su conexión a internet.")
                              }
                          }
                      } else if (quiet) {
                          statusTv.text = "No le escuché. Intente de nuevo."
                      } else if (error == SpeechRecognizer.ERROR_NETWORK || error == SpeechRecognizer.ERROR_NETWORK_TIMEOUT) {
                          addLog("Jarvis", "Sin internet: el reconocimiento de voz de Google lo necesita. Puede escribir sus órdenes.")
                      } else {
                          addLog("Jarvis", "El reconocimiento de voz falló (código $error). Intente de nuevo.")
                      }
                  }
              }

              private fun process(text: String) {
                  errors = 0
                  var t = text.trim()
                  if (t.isEmpty()) {
                      setState(0)
                      restartSoon()
                      return
                  }
                  if (!manual && !Brain.hasPending()) {
                      val m = wake.find(norm(t))
                      if (m == null) {
                          setState(0)
                          restartSoon()
                          return
                      }
                      t = t.substring(minOf(m.range.last + 1, t.length)).trim { it == ' ' || it == ',' || it == '.' || it == ':' }
                      if (t.isEmpty()) {
                          respond("A sus órdenes, ${sir()}.")
                          return
                      }
                  }
                  submit(t)
              }

              private fun submit(t: String) {
                  addLog("Usted", t)
                  setState(2)
                  val reply = Brain.handle(this, t)
                  respond(reply)
              }

              private fun respond(reply: String) {
                  addLog("Jarvis", reply)
                  setState(3)
                  Speaker.speak(reply) {
                      setState(0)
                      restartSoon()
                  }
              }
          }
