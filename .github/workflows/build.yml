          /** Orbe animado: 0 en espera, 1 escuchando, 2 procesando, 3 hablando. */
          class OrbView(ctx: android.content.Context) : View(ctx) {
              var state = 0
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val box = RectF()

              override fun onDraw(c: Canvas) {
                  super.onDraw(c)
                  val cx = width / 2f
                  val cy = height / 2f
                  val r = minOf(cx, cy) - 6f
                  val t = SystemClock.uptimeMillis() / 1000f
                  val col = if (state == 2) GOLD else CYAN
                  val amp = when (state) {
                      1 -> 0.10f + 0.06f * abs(sin(t * 5f))
                      3 -> 0.12f + 0.12f * abs(sin(t * 9f) * sin(t * 4f))
                      2 -> 0.08f
                      else -> 0.03f
                  }
                  val rgb = col and 0x00FFFFFF

                  p.style = Paint.Style.FILL
                  p.shader = RadialGradient(
                      cx, cy, r * (0.5f + amp),
                      intArrayOf(0xFFEAFAFF.toInt(), rgb or 0xD9000000.toInt(), rgb),
                      floatArrayOf(0f, 0.35f, 1f),
                      Shader.TileMode.CLAMP
                  )
                  c.drawCircle(cx, cy, r * (0.5f + amp), p)
                  p.shader = null

                  p.style = Paint.Style.STROKE
                  p.color = col
                  p.strokeWidth = 3f
                  c.drawCircle(cx, cy, r * 0.58f, p)

                  p.strokeWidth = 6f
                  p.strokeCap = Paint.Cap.ROUND
                  val speed = if (state == 2) 220f else 60f
                  box.set(cx - r * 0.74f, cy - r * 0.74f, cx + r * 0.74f, cy + r * 0.74f)
                  for (i in 0 until 3) {
                      c.drawArc(box, t * speed + i * 120f, 55f, false, p)
                  }

                  p.strokeWidth = 2f
                  p.alpha = 110
                  c.drawCircle(cx, cy, r * 0.9f, p)
                  p.alpha = 255

                  postInvalidateOnAnimation()
              }
          }

