      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Jarvis.apk
          gh release create "v${{ github.run_number }}" Jarvis.apk --repo "${{ github.repository }}" --title "Jarvis ${{ github.run_number }}" --notes "APK de Jarvis. Descargue Jarvis.apk e instálelo."
