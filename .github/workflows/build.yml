              <foreground android:drawable="@drawable/ic_jarvis_fg" />
          </adaptive-icon>
          JARVIS_EOF_7731
          mkdir -p "$(dirname "app/src/main/res/values/colors.xml")"
          cat > "app/src/main/res/values/colors.xml" <<'JARVIS_EOF_7731'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="jarvis_bg">#050B14</color>
          </resources>
          JARVIS_EOF_7731
          mkdir -p "$(dirname "build.gradle.kts")"
          cat > "build.gradle.kts" <<'JARVIS_EOF_7731'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          JARVIS_EOF_7731
          mkdir -p "$(dirname "gradle.properties")"
          cat > "gradle.properties" <<'JARVIS_EOF_7731'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          JARVIS_EOF_7731
          mkdir -p "$(dirname "gradle/wrapper/gradle-wrapper.properties")"
          cat > "gradle/wrapper/gradle-wrapper.properties" <<'JARVIS_EOF_7731'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          JARVIS_EOF_7731
          mkdir -p "$(dirname "settings.gradle.kts")"
          cat > "settings.gradle.kts" <<'JARVIS_EOF_7731'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
